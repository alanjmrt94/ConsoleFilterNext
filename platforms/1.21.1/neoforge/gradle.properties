# Plugin version for settings/plugins resolution
moddevgradle_version=2.0.144

# BMCL a veces redirige a USTC por IPv6 (inalcanzable aquí); forzar IPv4.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
