buildscript {
	repositories {
		maven { url = 'https://maven.minecraftforge.net' }
		mavenCentral()
	}
	dependencies {
		classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
	}
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

def props = new Properties()
file('../../../gradle.properties').withInputStream { props.load(it) }
file('../../../versions/1.16.1.properties').withInputStream { props.load(it) }

version = props['mod_version']
group = props['mod_group_id']
archivesBaseName = props['mod_id']

sourceSets.main.java {
	srcDir '../../../common-java8/src/main/java'
	srcDir '../../1.16.5/forge/src/main/java'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

minecraft {
	mappings channel: 'official', version: props['minecraft_version']

	runs {
		server {
			workingDirectory project.file('../../runs/1.16.1/forge')
			property 'forge.logging.markers', 'SCAN,REGISTRIES'
			property 'forge.logging.console.level', 'info'
			args '--nogui'

			mods {
				"${props['mod_id']}" {
					source sourceSets.main
				}
			}
		}

		client {
			workingDirectory project.file('../../runs/1.16.1/forge')
			property 'forge.logging.markers', 'SCAN,REGISTRIES'
			property 'forge.logging.console.level', 'info'

			mods {
				"${props['mod_id']}" {
					source sourceSets.main
				}
			}
		}
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${props['minecraft_version']}-${props['forge_version']}"
}

def ensureRunEula = tasks.register('ensureRunEula') {
	doLast {
		def runDir = project.file('../../runs/1.16.1/forge')
		runDir.mkdirs()
		new File(runDir, 'eula.txt').text = "eula=true\n"
	}
}

tasks.matching { it.name == 'runServer' || it.name == 'runClient' }.all {
	dependsOn ensureRunEula
	def java8Home = System.getenv('JAVA8_HOME')
	if (java8Home) {
		executable = "${java8Home}/bin/java"
	}
}

def replaceProperties = [
		minecraft_version      : props['minecraft_version'],
		minecraft_version_range: props['minecraft_version_range'],
		forge_version          : props['forge_version'],
		forge_version_range    : props['forge_version_range'],
		loader_version_range   : props['loader_version_range'],
		mod_id                 : props['mod_id'],
		mod_name               : props['mod_name'],
		mod_license            : props['mod_license'],
		mod_version            : props['mod_version'],
		mod_authors            : props['mod_authors'],
		mod_description        : props['mod_description']
]

processResources {
	inputs.properties replaceProperties
	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.named('compileJava').configure {
	options.encoding = 'UTF-8'
	options.release = 8
}

jar {
	archiveClassifier = 'forge'
	from(file('../../../LICENSE.md')) {
		rename { "${it}_${props['mod_id']}" }
	}
	manifest {
		attributes([
				'Specification-Title'     : props['mod_id'],
				'Specification-Vendor'    : props['mod_authors'],
				'Specification-Version'   : '1',
				'Implementation-Title'    : props['mod_name'],
				'Implementation-Version'  : project.version,
				'Implementation-Vendor'   : props['mod_authors'],
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

jar.finalizedBy('reobfJar')
