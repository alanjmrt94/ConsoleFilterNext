name: Build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - '**/*.md'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew scripts/lint.sh
      - name: Lint (Spotless + -Werror)
        run: ./scripts/lint.sh ci

  build-forge:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build Forge
        run: ./gradlew clean :common:build :forge:build --no-daemon
      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: consolefilternext-forge
          path: platforms/1.20.1/forge/build/libs/consolefilternext-*-forge.jar
          if-no-files-found: error

  build-fabric:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      # Loom 1.14+ requiere JVM 21; el toolchain del proyecto sigue en 17 (MC 1.20.1).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
      - name: Grant execute permission
        run: chmod +x platforms/1.20.1/fabric/gradlew
      - name: Build Fabric
        run: cd platforms/1.20.1/fabric && ./gradlew clean build --no-daemon
      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: consolefilternext-fabric
          path: platforms/1.20.1/fabric/build/libs/consolefilternext-*-fabric.jar
          if-no-files-found: error

  build-neoforge:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission
        run: chmod +x platforms/1.20.1/neoforge/gradlew
      - name: Build NeoForge
        run: |
          set +e
          for attempt in 1 2 3; do
            (cd platforms/1.20.1/neoforge && ./gradlew clean build --no-daemon)
            status=$?
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            echo "NeoForge 1.20.1 build attempt ${attempt} failed (exit ${status}); retrying after maven 502/transient errors."
            sleep 20
          done
          exit 1
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: consolefilternext-neoforge
          path: |
            platforms/1.20.1/neoforge/build/libs/consolefilternext-*-neoforge.jar
          if-no-files-found: error

  server-smoke-forge:
    runs-on: ubuntu-latest
    needs: build-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew scripts/server-smoke.sh
      - name: Warm Gradle userdev
        run: ./gradlew :forge:build --no-daemon
      - name: Dedicated server smoke (Forge)
        timeout-minutes: 15
        env:
          SMOKE_TIMEOUT_SECONDS: 300
        run: ./scripts/server-smoke.sh forge

  server-smoke-fabric:
