name: Publish distribution

# Sube los JARs (Forge + Fabric + NeoForge) a Modrinth y CurseForge cuando se publica un tag.
# Requiere secrets en el environment "publish" (ver README → CI/CD).

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Loom 1.14+ requiere JVM 21; JDK 17 cubre el toolchain de Forge/Fabric/NeoForge (MC 1.20.1).
      - name: Set up JDK 17 and 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Grant execute permission
        run: |
          chmod +x gradlew scripts/release.sh scripts/publish-release.sh scripts/discord-notify.sh
          chmod +x fabric/gradlew neoforge/gradlew

      - name: Build Forge (root Gradle)
        run: ./gradlew clean :common:build :forge:build --no-daemon

      - name: Build Fabric
        run: cd fabric && ./gradlew clean build --no-daemon

      - name: Build NeoForge
        run: cd neoforge && ./gradlew clean build --no-daemon

      - name: List release artifacts
        run: |
          ls -la forge/build/libs/ fabric/build/libs/ neoforge/build/libs/ || true

      - name: Publish to Modrinth and CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_AUTHOR_TOKEN: ${{ secrets.CURSEFORGE_AUTHOR_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_SLUG }}
          CURSEFORGE_PROJECT_SLUG: ${{ vars.CURSEFORGE_PROJECT_SLUG }}
          RELEASE_TYPE: ${{ vars.RELEASE_TYPE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ] && [ -z "${CURSEFORGE_API_TOKEN}" ] && [ -z "${CURSEFORGE_AUTHOR_TOKEN}" ]; then
            echo "No distribution secrets configured; skipping Modrinth and CurseForge upload."
            echo "Configure MODRINTH_TOKEN and/or CURSEFORGE_* tokens in the publish environment (Settings → Environments → publish)."
            exit 0
          fi
          ./scripts/release.sh publish --skip-build --skip-github
