name: Publish distribution

# Sube los JARs de la línea MC del tag ({mc}-{semver}) a Modrinth y CurseForge.
# Requiere secrets en el environment "publish" (ver README → CI/CD).

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      mc:
        description: 'Línea Minecraft a publicar desde esta rama (ej. 1.8.9, 1.20.1). Usa el workflow actual, no el commit del tag.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag ({mc}-{semver})
        id: tag
        env:
          DISPATCH_MC: ${{ github.event.inputs.mc }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MC="${DISPATCH_MC}"
            if [ -z "${MC}" ]; then
              echo "workflow_dispatch requiere input mc (p. ej. 1.8.9)"
              exit 1
            fi
            if [ -f "versions/${MC}.properties" ]; then
              TAG="$(sed -n 's/^mod_version=//p' "versions/${MC}.properties" | head -1 | tr -d '\r')"
            else
              TAG="$(sed -n 's/^mod_version=//p' gradle.properties | head -1 | tr -d '\r')"
            fi
            if [ -z "${TAG}" ]; then
              echo "No se resolvió mod_version para ${MC}"
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            SEMVER="${TAG##*-}"
            MC="${TAG%-${SEMVER}}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mc=${MC}" >> "$GITHUB_OUTPUT"
          echo "Parsed tag=${TAG} mc=${MC}"

      - name: Set up JDK 8, 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
          cache: gradle

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Grant execute permission
        run: |
          chmod +x gradlew scripts/release.sh scripts/publish-release.sh scripts/discord-notify.sh scripts/ci-retry-gradle.sh
          chmod +x platforms/1.20.1/fabric/gradlew platforms/1.20.1/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/26.1/fabric/gradlew platforms/26.1/neoforge/gradlew platforms/26.1/forge/gradlew platforms/26.2/fabric/gradlew platforms/26.2/neoforge/gradlew platforms/26.2/forge/gradlew platforms/26.3/fabric/gradlew platforms/26.3/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/1.21.*/forge/gradlew platforms/1.21.*/fabric/gradlew platforms/1.21.*/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/1.20.*/forge/gradlew platforms/1.20.*/fabric/gradlew platforms/1.20.*/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/1.19.*/forge/gradlew platforms/1.19.*/fabric/gradlew 2>/dev/null || true
          chmod +x platforms/1.16.5/forge/gradlew platforms/1.16.5/fabric/gradlew 2>/dev/null || true
          chmod +x platforms/1.16.1/forge/gradlew platforms/1.16.1/fabric/gradlew 2>/dev/null || true
          chmod +x platforms/1.12.2/forge/gradlew platforms/1.12.2/fabric/gradlew platforms/1.8.9/forge/gradlew platforms/1.8.9/fabric/gradlew 2>/dev/null || true

      - name: Build JARs for tag MC
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
        run: |
          set -euo pipefail
          MC="${PUBLISH_MC}"
          j8="${JAVA_HOME_8_X64:-${JAVA_HOME_8:-}}"
          j17="${JAVA_HOME_17_X64:-${JAVA_HOME_17:-}}"
          j21="${JAVA_HOME_21_X64:-${JAVA_HOME_21:-${JAVA_HOME}}}"
          j25="${JAVA_HOME_25_X64:-${JAVA_HOME_25:-}}"
          cf_gradle() {
            local dir="$1" home="$2"
            shift 2
            if [[ -z "${home}" ]]; then
              echo "Missing JAVA_HOME for ${dir}"
              exit 1
            fi
            JAVA_HOME="${home}" PATH="${home}/bin:${PATH}" ./scripts/ci-retry-gradle.sh "${dir}" "$@"
          }
          case "${MC}" in
            1.20.1)
              ./gradlew clean :common:build :forge:build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/1.20.1/fabric clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/1.20.1/neoforge clean build --no-daemon
              ;;
            26.1)
              ./scripts/ci-retry-gradle.sh platforms/26.1/fabric clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/26.1/neoforge clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/26.1/forge clean build --no-daemon
              ;;
            26.2)
              ./scripts/ci-retry-gradle.sh platforms/26.2/fabric clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/26.2/neoforge clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/26.2/forge clean build --no-daemon
              ;;
            26.3)
              ./scripts/ci-retry-gradle.sh platforms/26.3/fabric clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/26.3/neoforge clean build --no-daemon
              ;;
            1.20.2)
              cf_gradle platforms/1.20.2/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.20.2/fabric "${j21}" clean build --no-daemon
              ;;
            1.20.3)
              cf_gradle platforms/1.20.3/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.20.3/fabric "${j21}" clean build --no-daemon
              ;;
            1.20.4)
              cf_gradle platforms/1.20.4/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.20.4/fabric "${j21}" clean build --no-daemon
              cf_gradle platforms/1.20.4/neoforge "${j21}" clean build --no-daemon
              ;;
            1.20.5)
              ./scripts/ci-retry-gradle.sh platforms/1.20.5/fabric clean build --no-daemon
              ;;
            1.20.6)
              ./scripts/ci-retry-gradle.sh platforms/1.20.6/forge clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/1.20.6/fabric clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/1.20.6/neoforge clean build --no-daemon
              ;;
            1.21.1)
              ./scripts/ci-retry-gradle.sh platforms/1.21.1/forge clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/1.21.1/fabric clean build --no-daemon
              ./scripts/ci-retry-gradle.sh platforms/1.21.1/neoforge clean build --no-daemon
              ;;
            1.16.5)
              cf_gradle platforms/1.16.5/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.16.5/fabric "${j21}" clean build --no-daemon
              ;;
            1.16.1)
              cf_gradle platforms/1.16.1/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.16.1/fabric "${j21}" clean build --no-daemon
              ;;
            1.12.2)
              cf_gradle platforms/1.12.2/forge "${j25}" clean build --no-daemon
              cf_gradle platforms/1.12.2/fabric "${j21}" clean build --no-daemon
              ;;
            1.8.9)
              cf_gradle platforms/1.8.9/forge "${j8}" setupCiWorkspace clean build --no-daemon
              cf_gradle platforms/1.8.9/fabric "${j21}" clean build --no-daemon
              ;;
            *)
              FOUND=0
              for loader in forge fabric neoforge; do
                if [[ -d "platforms/${MC}/${loader}" ]]; then
                  FOUND=1
                  home="${j21}"
                  if [[ "${MC}" == 1.19.* && "${loader}" == forge ]]; then
                    home="${j17}"
                  fi
                  cf_gradle "platforms/${MC}/${loader}" "${home}" clean build --no-daemon
                fi
              done
              if [[ "${FOUND}" -eq 0 ]]; then
                echo "Unsupported MC line in tag: ${MC}"
                exit 1
              fi
              ;;
          esac

      - name: List release artifacts
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
        run: |
          case "${PUBLISH_MC}" in
            1.20.1) ls -la platforms/1.20.1/forge/build/libs/ platforms/1.20.1/fabric/build/libs/ platforms/1.20.1/neoforge/build/libs/ || true ;;
            26.1) ls -la platforms/26.1/fabric/build/libs/ platforms/26.1/neoforge/build/libs/ platforms/26.1/forge/build/libs/ || true ;;
            26.2) ls -la platforms/26.2/fabric/build/libs/ platforms/26.2/neoforge/build/libs/ platforms/26.2/forge/build/libs/ || true ;;
            26.3) ls -la platforms/26.3/fabric/build/libs/ platforms/26.3/neoforge/build/libs/ || true ;;
            1.20.2) ls -la platforms/1.20.2/forge/build/libs/ platforms/1.20.2/fabric/build/libs/ || true ;;
            1.20.3) ls -la platforms/1.20.3/forge/build/libs/ platforms/1.20.3/fabric/build/libs/ || true ;;
            1.20.4) ls -la platforms/1.20.4/forge/build/libs/ platforms/1.20.4/fabric/build/libs/ platforms/1.20.4/neoforge/build/libs/ || true ;;
            1.20.5) ls -la platforms/1.20.5/fabric/build/libs/ || true ;;
            1.20.6) ls -la platforms/1.20.6/forge/build/libs/ platforms/1.20.6/fabric/build/libs/ platforms/1.20.6/neoforge/build/libs/ || true ;;
            1.21.1) ls -la platforms/1.21.1/forge/build/libs/ platforms/1.21.1/fabric/build/libs/ platforms/1.21.1/neoforge/build/libs/ || true ;;
            1.16.5) ls -la platforms/1.16.5/forge/build/libs/ platforms/1.16.5/fabric/build/libs/ || true ;;
            1.16.1) ls -la platforms/1.16.1/forge/build/libs/ platforms/1.16.1/fabric/build/libs/ || true ;;
            1.12.2) ls -la platforms/1.12.2/forge/build/libs/ platforms/1.12.2/fabric/build/libs/ || true ;;
            1.8.9) ls -la platforms/1.8.9/forge/build/libs/ platforms/1.8.9/fabric/build/libs/ || true ;;
            *)
              for loader in forge fabric neoforge; do
                ls -la "platforms/${PUBLISH_MC}/${loader}/build/libs/" 2>/dev/null || true
              done
              ;;
          esac

      - name: Publish to Modrinth and CurseForge
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_AUTHOR_TOKEN: ${{ secrets.CURSEFORGE_AUTHOR_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_SLUG }}
          CURSEFORGE_PROJECT_SLUG: ${{ vars.CURSEFORGE_PROJECT_SLUG }}
          RELEASE_TYPE: ${{ vars.RELEASE_TYPE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ] && [ -z "${CURSEFORGE_API_TOKEN}" ] && [ -z "${CURSEFORGE_AUTHOR_TOKEN}" ]; then
            echo "No distribution secrets configured; skipping Modrinth and CurseForge upload."
            echo "Configure MODRINTH_TOKEN and/or CURSEFORGE_* tokens in the publish environment (Settings → Environments → publish)."
            exit 0
          fi
          ./scripts/release.sh publish --skip-build --skip-github
