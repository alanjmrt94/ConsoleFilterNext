name: Publish distribution

# Sube los JARs de la línea MC del tag ({mc}-{semver}) a Modrinth y CurseForge.
# Requiere secrets en el environment "publish" (ver README → CI/CD).

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag ({mc}-{semver})
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG##*-}"
          MC="${TAG%-${SEMVER}}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mc=${MC}" >> "$GITHUB_OUTPUT"
          echo "Parsed tag=${TAG} mc=${MC}"

      - name: Set up JDK 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
          cache: gradle

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Grant execute permission
        run: |
          chmod +x gradlew scripts/release.sh scripts/publish-release.sh scripts/discord-notify.sh
          chmod +x fabric/gradlew neoforge/gradlew 2>/dev/null || true
          chmod +x fabric-26.1/gradlew neoforge-26.1/gradlew fabric-26.2/gradlew neoforge-26.2/gradlew 2>/dev/null || true

      - name: Build JARs for tag MC
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
        run: |
          set -euo pipefail
          MC="${PUBLISH_MC}"
          case "${MC}" in
            1.20.1)
              ./gradlew clean :common:build :forge:build --no-daemon
              (cd fabric && ./gradlew clean build --no-daemon)
              (cd neoforge && ./gradlew clean build --no-daemon)
              ;;
            26.1)
              (cd fabric-26.1 && ./gradlew clean build --no-daemon)
              (cd neoforge-26.1 && ./gradlew clean build --no-daemon)
              ;;
            26.2)
              (cd fabric-26.2 && ./gradlew clean build --no-daemon)
              (cd neoforge-26.2 && ./gradlew clean build --no-daemon)
              ;;
            *)
              echo "Unsupported MC line in tag: ${MC}"
              exit 1
              ;;
          esac

      - name: List release artifacts
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
        run: |
          case "${PUBLISH_MC}" in
            1.20.1) ls -la forge/build/libs/ fabric/build/libs/ neoforge/build/libs/ || true ;;
            26.1) ls -la fabric-26.1/build/libs/ neoforge-26.1/build/libs/ || true ;;
            26.2) ls -la fabric-26.2/build/libs/ neoforge-26.2/build/libs/ || true ;;
          esac

      - name: Publish to Modrinth and CurseForge
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_AUTHOR_TOKEN: ${{ secrets.CURSEFORGE_AUTHOR_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_PROJECT_SLUG: ${{ vars.MODRINTH_PROJECT_SLUG }}
          CURSEFORGE_PROJECT_SLUG: ${{ vars.CURSEFORGE_PROJECT_SLUG }}
          RELEASE_TYPE: ${{ vars.RELEASE_TYPE }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "${MODRINTH_TOKEN}" ] && [ -z "${CURSEFORGE_API_TOKEN}" ] && [ -z "${CURSEFORGE_AUTHOR_TOKEN}" ]; then
            echo "No distribution secrets configured; skipping Modrinth and CurseForge upload."
            echo "Configure MODRINTH_TOKEN and/or CURSEFORGE_* tokens in the publish environment (Settings → Environments → publish)."
            exit 0
          fi
          ./scripts/release.sh publish --skip-build --skip-github
