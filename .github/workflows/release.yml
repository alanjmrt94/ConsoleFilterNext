name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission
        run: |
          chmod +x gradlew fabric/gradlew neoforge/gradlew

      - name: Build Forge
        run: ./gradlew clean :common:build :forge:build --no-daemon

      - name: Build Fabric
        run: cd fabric && ./gradlew clean build --no-daemon

      - name: Build NeoForge
        run: cd neoforge && ./gradlew clean build --no-daemon

      - name: Stage release JARs
        run: |
          mkdir -p dist
          cp forge/build/libs/consolefilternext-*-forge.jar dist/ || true
          cp fabric/build/libs/consolefilternext-*-fabric.jar dist/ || true
          cp neoforge/build/libs/consolefilternext-*-neoforge.jar dist/ || true
          # Excluir sources/javadoc del staging
          rm -f dist/*-sources.jar dist/*-javadoc.jar
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolefilternext-mod
          path: dist/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: dist/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true
