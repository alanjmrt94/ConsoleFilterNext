name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse tag ({mc}-{semver})
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          SEMVER="${TAG##*-}"
          MC="${TAG%-${SEMVER}}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mc=${MC}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "Parsed tag=${TAG} mc=${MC} semver=${SEMVER}"

      - name: Set up JDK 8, 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
          cache: gradle

      - name: Grant execute permission
        run: |
          chmod +x gradlew scripts/*.sh
          chmod +x platforms/1.20.1/fabric/gradlew platforms/1.20.1/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/26.1/fabric/gradlew platforms/26.1/neoforge/gradlew platforms/26.1/forge/gradlew platforms/26.2/fabric/gradlew platforms/26.2/neoforge/gradlew platforms/26.2/forge/gradlew platforms/26.3/fabric/gradlew platforms/26.3/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/1.21.*/forge/gradlew platforms/1.21.*/fabric/gradlew platforms/1.21.*/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/1.20.*/forge/gradlew platforms/1.20.*/fabric/gradlew platforms/1.20.*/neoforge/gradlew 2>/dev/null || true
          chmod +x platforms/1.19.*/forge/gradlew platforms/1.19.*/fabric/gradlew 2>/dev/null || true
          chmod +x platforms/1.16.5/forge/gradlew platforms/1.16.5/fabric/gradlew 2>/dev/null || true
          chmod +x platforms/1.16.1/forge/gradlew platforms/1.16.1/fabric/gradlew 2>/dev/null || true
          chmod +x platforms/1.12.2/forge/gradlew platforms/1.12.2/fabric/gradlew platforms/1.8.9/forge/gradlew platforms/1.8.9/fabric/gradlew 2>/dev/null || true

      - name: Build matrix cell JARs for tag MC
        env:
          PUBLISH_MC: ${{ steps.tag.outputs.mc }}
        run: |
          set -euo pipefail
          MC="${PUBLISH_MC}"
          j8="${JAVA_HOME_8_X64:-${JAVA_HOME_8:-}}"
          j17="${JAVA_HOME_17_X64:-${JAVA_HOME_17:-}}"
          j21="${JAVA_HOME_21_X64:-${JAVA_HOME_21:-${JAVA_HOME}}}"
          j25="${JAVA_HOME_25_X64:-${JAVA_HOME_25:-}}"
          cf_gradle() {
            local dir="$1" home="$2"
            shift 2
            if [[ -z "${home}" ]]; then
              echo "Missing JAVA_HOME for ${dir}"
              exit 1
            fi
            chmod +x "${dir}/gradlew"
            (cd "${dir}" && JAVA_HOME="${home}" PATH="${home}/bin:${PATH}" ./gradlew "$@")
          }
          mkdir -p dist
          stage_one() {
            local pattern="$1"
            local matches
            matches=( ${pattern} )
            if [[ ! -e "${matches[0]}" ]]; then
              echo "Missing expected JAR(s): ${pattern}"
              exit 1
            fi
            cp "${matches[@]}" dist/
          }
          case "${MC}" in
            1.20.1)
              ./gradlew clean :common:build :forge:build --no-daemon
              (cd platforms/1.20.1/fabric && ./gradlew clean build --no-daemon)
              (cd platforms/1.20.1/neoforge && ./gradlew clean build --no-daemon)
              stage_one 'platforms/1.20.1/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.20.1/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/1.20.1/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              EXPECTED=3
              ;;
            26.1)
              (cd platforms/26.1/fabric && ./gradlew clean build --no-daemon)
              (cd platforms/26.1/neoforge && ./gradlew clean build --no-daemon)
              (cd platforms/26.1/forge && ./gradlew clean build --no-daemon)
              stage_one 'platforms/26.1/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/26.1/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              stage_one 'platforms/26.1/forge/build/libs/consolefilternext-*-forge.jar'
              EXPECTED=3
              ;;
            26.2)
              (cd platforms/26.2/fabric && ./gradlew clean build --no-daemon)
              (cd platforms/26.2/neoforge && ./gradlew clean build --no-daemon)
              (cd platforms/26.2/forge && ./gradlew clean build --no-daemon)
              stage_one 'platforms/26.2/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/26.2/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              stage_one 'platforms/26.2/forge/build/libs/consolefilternext-*-forge.jar'
              EXPECTED=3
              ;;
            26.3)
              (cd platforms/26.3/fabric && ./gradlew clean build --no-daemon)
              (cd platforms/26.3/neoforge && ./gradlew clean build --no-daemon)
              stage_one 'platforms/26.3/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/26.3/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              EXPECTED=2
              ;;
            1.20.2)
              cf_gradle platforms/1.20.2/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.20.2/fabric "${j21}" clean build --no-daemon
              stage_one 'platforms/1.20.2/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.20.2/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=2
              ;;
            1.20.3)
              cf_gradle platforms/1.20.3/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.20.3/fabric "${j21}" clean build --no-daemon
              stage_one 'platforms/1.20.3/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.20.3/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=2
              ;;
            1.20.4)
              cf_gradle platforms/1.20.4/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.20.4/fabric "${j21}" clean build --no-daemon
              cf_gradle platforms/1.20.4/neoforge "${j21}" clean build --no-daemon
              stage_one 'platforms/1.20.4/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.20.4/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/1.20.4/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              EXPECTED=3
              ;;
            1.20.5)
              (cd platforms/1.20.5/fabric && ./gradlew clean build --no-daemon)
              stage_one 'platforms/1.20.5/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=1
              ;;
            1.20.6)
              (cd platforms/1.20.6/forge && ./gradlew clean build --no-daemon)
              (cd platforms/1.20.6/fabric && ./gradlew clean build --no-daemon)
              (cd platforms/1.20.6/neoforge && ./gradlew clean build --no-daemon)
              stage_one 'platforms/1.20.6/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.20.6/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/1.20.6/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              EXPECTED=3
              ;;
            1.21.1)
              (cd platforms/1.21.1/forge && ./gradlew clean build --no-daemon)
              (cd platforms/1.21.1/fabric && ./gradlew clean build --no-daemon)
              (cd platforms/1.21.1/neoforge && ./gradlew clean build --no-daemon)
              stage_one 'platforms/1.21.1/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.21.1/fabric/build/libs/consolefilternext-*-fabric.jar'
              stage_one 'platforms/1.21.1/neoforge/build/libs/consolefilternext-*-neoforge.jar'
              EXPECTED=3
              ;;
            1.16.5)
              cf_gradle platforms/1.16.5/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.16.5/fabric "${j21}" clean build --no-daemon
              stage_one 'platforms/1.16.5/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.16.5/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=2
              ;;
            1.16.1)
              cf_gradle platforms/1.16.1/forge "${j17}" clean build --no-daemon
              cf_gradle platforms/1.16.1/fabric "${j21}" clean build --no-daemon
              stage_one 'platforms/1.16.1/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.16.1/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=2
              ;;
            1.12.2)
              cf_gradle platforms/1.12.2/forge "${j25}" clean build --no-daemon
              cf_gradle platforms/1.12.2/fabric "${j21}" clean build --no-daemon
              stage_one 'platforms/1.12.2/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.12.2/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=2
              ;;
            1.8.9)
              cf_gradle platforms/1.8.9/forge "${j8}" setupCiWorkspace clean build --no-daemon
              cf_gradle platforms/1.8.9/fabric "${j21}" clean build --no-daemon
              stage_one 'platforms/1.8.9/forge/build/libs/consolefilternext-*-forge.jar'
              stage_one 'platforms/1.8.9/fabric/build/libs/consolefilternext-*-fabric.jar'
              EXPECTED=2
              ;;
            *)
              EXPECTED=0
              for loader in forge fabric neoforge; do
                if [[ -d "platforms/${MC}/${loader}" ]]; then
                  home="${j21}"
                  if [[ "${MC}" == 1.19.* && "${loader}" == forge ]]; then
                    home="${j17}"
                  fi
                  cf_gradle "platforms/${MC}/${loader}" "${home}" clean build --no-daemon
                  stage_one "platforms/${MC}/${loader}/build/libs/consolefilternext-*-${loader}.jar"
                  EXPECTED=$((EXPECTED + 1))
                fi
              done
              if [[ "${EXPECTED}" -eq 0 ]]; then
                echo "Unsupported MC line in tag: ${MC}"
                exit 1
              fi
              ;;
          esac
          rm -f dist/*-sources.jar dist/*-javadoc.jar
          ls -la dist/
          COUNT="$(ls -1 dist/*.jar 2>/dev/null | wc -l)"
          echo "Staged ${COUNT} JAR(s); expected ${EXPECTED}"
          test "${COUNT}" -eq "${EXPECTED}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: consolefilternext-mod
          path: dist/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          artifacts: dist/*.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true
