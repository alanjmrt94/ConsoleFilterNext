plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev.legacyforge' version '2.0.142'
}

def props = new Properties()
file('../gradle.properties').withInputStream { props.load(it) }
props.each { key, value ->
	if (!project.hasProperty(key)) {
		project.ext.set(key as String, value)
	}
}

version = props['mod_version']
group = props['mod_group_id']

base {
	archivesName = props['mod_id'] as String
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	withSourcesJar()
}

// NeoForge 1.20.1: adaptador propio + common (no reutiliza fuentes Forge:
// FML 47.1.x no tiene registerConfig/registerExtensionPoint en FMLJavaModLoadingContext).
sourceSets {
	main {
		java {
			srcDir '../common/src/main/java'
		}
	}
}

repositories {
	mavenCentral()
}

legacyForge {
	enable {
		neoForgeVersion = props['neoforge_version'] as String
	}

	parchment {
		mappingsVersion = props['parchment_mappings_version'] as String
		minecraftVersion = props['parchment_minecraft_version'] as String
	}

	runs {
		client {
			client()
			gameDirectory = project.file('../run-neoforge')
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
		server {
			server()
			gameDirectory = project.file('../run-neoforge')
			programArgument '--nogui'
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}
		configureEach {
			systemProperty 'forge.enabledGameTestNamespaces', props['mod_id']
		}
	}

	mods {
		"${props['mod_id']}" {
			sourceSet(sourceSets.main)
		}
	}
}

dependencies {
	implementation 'com.electronwill.night-config:core:3.6.7'
	implementation 'com.electronwill.night-config:toml:3.6.7'

	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def replaceProperties = [
		minecraft_version      : props['minecraft_version'],
		minecraft_version_range: props['minecraft_version_range'],
		forge_version          : props['neoforge_loader_label'],
		forge_version_range    : props['neoforge_version_range'],
		loader_version_range   : props['loader_version_range'],
		mod_id                 : props['mod_id'],
		mod_name               : props['mod_name'],
		mod_license            : props['mod_license'],
		mod_version            : props['mod_version'],
		mod_authors            : props['mod_authors'],
		mod_description        : props['mod_description'],
		mod_environment        : props['mod_environment']
]

processResources {
	inputs.properties replaceProperties
	filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}
}

tasks.named('jar', Jar).configure {
	archiveClassifier.set('neoforge')
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(file('../LICENSE.md')) {
		rename { "${it}_${props['mod_id']}" }
	}
	manifest {
		attributes([
				'Specification-Title'     : props['mod_id'],
				'Specification-Vendor'    : props['mod_authors'],
				'Specification-Version'   : props['mod_version'],
				'Implementation-Title'    : props['mod_name'],
				'Implementation-Version'  : props['mod_version'],
				'Implementation-Vendor'   : props['mod_authors'],
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

test {
	useJUnitPlatform()
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
