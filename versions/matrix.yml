# Matriz MC × loader. mod_semver debe coincidir con el sufijo de mod_version
# en gradle.properties (ej. mod_version=1.20.1-4.2.0 → mod_semver=4.2.0).
#
# project:
#   - ":forge" → subproyecto del Gradle raíz (platforms/1.20.1/forge)
#   - "platforms/{mc}/{loader}" → wrapper Gradle aislado en esa carpeta
mod_id: consolefilternext
mod_semver: "4.2.0"

targets:
  - id: mc1.20.1-forge
    minecraft: "1.20.1"
    loader: forge
    java: 17
    enabled: true
    project: ":forge"

  - id: mc1.20.1-fabric
    minecraft: "1.20.1"
    loader: fabric
    java: 17
    enabled: true
    project: "platforms/1.20.1/fabric"

  - id: mc1.20.1-neoforge
    minecraft: "1.20.1"
    loader: neoforge
    java: 17
    enabled: true
    project: "platforms/1.20.1/neoforge"

  - id: mc1.21-forge
    minecraft: "1.21.1"
    loader: forge
    java: 21
    enabled: true
    project: "platforms/1.21.1/forge"

  - id: mc1.21-fabric
    minecraft: "1.21.1"
    loader: fabric
    java: 21
    enabled: true
    project: "platforms/1.21.1/fabric"

  - id: mc1.21-neoforge
    minecraft: "1.21.1"
    loader: neoforge
    java: 21
    enabled: true
    project: "platforms/1.21.1/neoforge"

  # 26.x: Fabric + NeoForge + Forge (FG7 / EventBus 7). Java 25.
